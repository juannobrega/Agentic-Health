server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: toda rota desconhecida cai no index, para o React Router resolver
    location / {
        try_files $uri $uri/ /index.html;
    }

    # a API é alcançada pelo nome do serviço na rede do compose
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
